<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hôm nay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B54C9}a:hover{color:#1E3E99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #191C24; font-family: Inter, 'Noto Sans KR', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 60px 20px 20px; display: flex; flex-direction: column; gap: 22px;">
    <header style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; color: #4C5260; font-weight: 500;">Thứ Sáu, 13/11</div>
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;">Hôm nay</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDDBD3; font-size: 13px; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A5B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"></path></svg>
        12 ngày
      </div>
    </header>

    <section style="background: #191C24; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 13px; color: #B9BFCC;">Đến hạn ôn</div>
          <div style="font-size: 26px; font-weight: 700;">3 bộ · 70 thẻ</div>
        </div>
        <svg width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="Đã ôn 1 trên 4 bộ"><circle cx="28" cy="28" r="23" fill="none" stroke="#343946" stroke-width="6"></circle><circle cx="28" cy="28" r="23" fill="none" stroke="#7C9BFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="36 145" transform="rotate(-90 28 28)"></circle></svg>
      </div>
      <a href="Phone-Study.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; background: #FFFFFF; color: #191C24; font-weight: 600; font-size: 16px; text-decoration: none;">
        Bắt đầu ôn
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Bộ cần ôn</h2>
      <sc-for list="{{due}}" as="d" hint-placeholder-count="3">
        <a href="Phone-Study.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDDBD3; text-decoration: none; color: #191C24;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: {{d.tint}}; color: {{d.ink}}; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 14px;">{{d.skill}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.name}}</div>
            <div style="font-size: 12px; color: #4C5260;">{{d.meta}}</div>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: {{d.dueInk}};">{{d.due}}</span>
        </a>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <a href="Phone-Listen.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: #E3F2EA; color: #155A37; text-decoration: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>
        <div style="font-size: 22px; font-weight: 700;">5 clip</div>
        <div style="font-size: 13px; font-weight: 500;">Luyện nghe hôm nay</div>
      </a>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: #FFF1DB; color: #7A4800;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
        <div style="font-size: 22px; font-weight: 700;">18 thẻ</div>
        <div style="font-size: 13px; font-weight: 500;">Từ khó nhớ</div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 17px; font-weight: 600;">7 ngày qua</h2>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; height: 84px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DDDBD3; border-radius: 16px;">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div style="width: 22px; height: {{w.h}}; border-radius: 6px; background: {{w.c}};"></div>
            <div style="font-size: 11px; color: #4C5260;">{{w.d}}</div>
          </div>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Điều hướng chính" style="display: flex; justify-content: space-around; padding: 10px 8px 30px; background: #FFFFFF; border-top: 1px solid #DDDBD3;">
    <a href="Phone-Today.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 600; color: #2B54C9; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Hôm nay</a>
    <a href="Phone-Study.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 500; color: #4C5260; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="16" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v14"></path></svg>Học</a>
    <a href="Phone-Listen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 500; color: #4C5260; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>Nghe</a>
    <a href="Mac-Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 500; color: #4C5260; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-.9 3 15.5-3.5.9z"></path></svg>Thư viện</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      due: [
        { skill: '읽기', tint: '#E6ECFB', ink: '#1E3E99', name: 'Rừng & Bảo vệ môi trường', meta: '26 thẻ · bậc 3 (7 ngày)', due: 'Hôm nay', dueInk: '#2B54C9' },
        { skill: '듣기', tint: '#E3F2EA', ink: '#155A37', name: '듣기 4-8번 > 병원', meta: '11 thẻ · lần trước 74% đúng', due: 'Trễ 1 ngày', dueInk: '#B23A2E' },
        { skill: '문법', tint: '#FFF1DB', ink: '#7A4800', name: 'Tự học ngữ pháp', meta: '9 thẻ · bậc 1 (1 ngày)', due: 'Hôm nay', dueInk: '#2B54C9' }
      ],
      week: [
        { d: 'T7', h: '30px', c: '#C9D5F5' }, { d: 'CN', h: '12px', c: '#C9D5F5' }, { d: 'T2', h: '44px', c: '#C9D5F5' }, { d: 'T3', h: '26px', c: '#C9D5F5' },
        { d: 'T4', h: '50px', c: '#C9D5F5' }, { d: 'T5', h: '38px', c: '#C9D5F5' }, { d: 'T6', h: '18px', c: '#2B54C9' }
      ]
    };
  }
}
</script>
</body>
</html>
