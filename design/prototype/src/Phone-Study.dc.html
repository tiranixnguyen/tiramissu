<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Học thẻ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B54C9}a:hover{color:#1E3E99}
button{cursor:pointer}
/* Chữ trong nút không bao giờ xuống dòng */
button,.nav,.kbd,a[style*="height:"]{white-space:nowrap}
button,a[style*="height:"]{flex-shrink:0}
button>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #191C24; font-family: Inter, 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 34px; gap: 18px;">

  <header style="display: flex; align-items: center; gap: 12px;">
    <a href="Phone-Today.dc.html" aria-label="Thoát lượt học" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #191C24; background: #FFFFFF; border: 1px solid #DDDBD3;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #4C5260;">
        <span style="font-weight: 600; color: #191C24;">Plastic · tái chế</span>
        <span>{{mastered}}/26 đã thuộc</span>
      </div>
      <div style="height: 6px; border-radius: 999px; background: #DDDBD3; overflow: hidden;">
        <div style="height: 6px; width: {{progressW}}; background: #2B54C9; border-radius: 999px;"></div>
      </div>
    </div>
  </header>

  <section style="flex: 1; min-height: 0; background: #FFFFFF; border: 1px solid #DDDBD3; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 12px; font-weight: 600; color: #4C5260; letter-spacing: 0.04em;">{{kindLabel}}</span>
      <div style="display: flex; gap: 6px;">
        <button onClick="{{toggleStar}}" aria-label="Đánh dấu khó nhớ" aria-pressed="{{starredStr}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDDBD3; background: {{starBg}}; color: {{starInk}}; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="{{starFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
        </button>
        <button onClick="{{toggleHanja}}" aria-label="Đánh dấu từ Hán Hàn" aria-pressed="{{hanjaStr}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDDBD3; background: {{hanjaBg}}; color: {{hanjaInk}}; font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700;">漢</button>
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center;">
      <div style="font-size: {{frontSize}}; font-family: {{frontFont}}; font-weight: 600; line-height: 1.4;">{{card.front}}</div>
      <sc-if value="{{card.hint}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 13px; color: #4C5260;">Gợi ý: {{card.hint}}</div>
      </sc-if>
    </div>

    <sc-if value="{{showBack}}" hint-placeholder-val="{{false}}">
      <div style="border-top: 1px dashed #DDDBD3; padding-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <div style="font-family: {{backFont}}; font-size: {{backSize}}; font-weight: 700; color: {{backInk}}; text-align: center; line-height: 1.4;">{{card.back}}</div>
        <button aria-label="Nghe phát âm" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #E6ECFB; color: #1E3E99; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
        </button>
      </div>
    </sc-if>
    <sc-if value="{{showNote}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 13px; line-height: 1.5; color: #4C5260; background: #F5F4F0; border-radius: 12px; padding: 10px 12px;">{{card.note}}</div>
    </sc-if>
  </section>

  <sc-if value="{{isTyped}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: {{fieldLabelInk}};">{{fieldLabel}}
        <input value="{{answer}}" onChange="{{onType}}" onKeyDown="{{onKey}}" lang="ko" autocomplete="off" placeholder="Gõ tiếng Hàn…" style="height: 54px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{fieldBorder}}; background: {{fieldBg}}; color: #191C24; padding: 0 16px; font: 500 20px 'Noto Sans KR', sans-serif; outline-color: #2B54C9;">
      </label>
      <sc-if value="{{isAsk}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 10px;">
          <button onClick="{{reveal}}" style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #DDDBD3; background: #FFFFFF; color: #191C24; font: 600 15px Inter, sans-serif;">Xem đáp án</button>
          <button onClick="{{check}}" style="flex: 1.4; height: 50px; border-radius: 14px; border: 0; background: #2B54C9; color: #FFFFFF; font: 600 16px Inter, sans-serif;">Chấm bài</button>
        </div>
      </sc-if>
      <sc-if value="{{isWrong}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; gap: 10px;">
          <button onClick="{{override}}" style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #DDDBD3; background: #FFFFFF; color: #191C24; font: 600 15px Inter, sans-serif;">Đã trả lời đúng?</button>
          <button onClick="{{next}}" style="flex: 1.4; height: 50px; border-radius: 14px; border: 0; background: #191C24; color: #FFFFFF; font: 600 16px Inter, sans-serif;">Thẻ tiếp</button>
        </div>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <button onClick="{{next}}" style="height: 50px; border-radius: 14px; border: 0; background: #191C24; color: #FFFFFF; font: 600 16px Inter, sans-serif;">Thẻ tiếp</button>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isSelf}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-if value="{{selfFront}}" hint-placeholder-val="{{true}}">
        <button onClick="{{flip}}" style="height: 54px; border-radius: 14px; border: 0; background: #2B54C9; color: #FFFFFF; font: 600 16px Inter, sans-serif;">Lật thẻ</button>
      </sc-if>
      <sc-if value="{{selfBack}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; gap: 10px;">
          <button onClick="{{forgot}}" style="flex: 1; height: 54px; border-radius: 14px; border: 0; background: #FBE9E6; color: #8E2B22; font: 600 16px Inter, sans-serif;">Chưa nhớ</button>
          <button onClick="{{remembered}}" style="flex: 1; height: 54px; border-radius: 14px; border: 0; background: #E3F2EA; color: #155A37; font: 600 16px Inter, sans-serif;">Nhớ</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="display: flex; justify-content: space-between; font-size: 12px; color: #4C5260;">
    <span>Đúng {{correct}}/{{attempted}}</span>
    <button onClick="{{masterNow}}" style="border: 0; background: none; padding: 0; min-height: 24px; font: 600 12px Inter, sans-serif; color: #2B54C9;">Đã thuộc thẻ này</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, answer: '', phase: 'ask', correct: 0, attempted: 0, mastered: 11, starred: {}, hanja: {} };
    this.cards = [
      { id: 'a', front: 'tái chế', back: '재활용하다', hint: '재활…', note: 'Hán Hàn: 再活用 — 플라스틱 병을 재활용하다 (tái chế chai nhựa).', typed: true },
      { id: 'b', front: 'chi phí chế tạo ít tốn kém', back: '제작 비용이 적게 들다', hint: '', note: '', typed: true },
      { id: 'c', front: '플라스틱 병을 재활용하는 방법에는 여러 가지가 있다.', back: 'Có nhiều cách để tái chế chai nhựa.', hint: '', note: 'Một trong số đó là làm đồng phục cho vận động viên.', typed: false }
    ];
  }
  norm(s) { return (s || '').normalize('NFC').trim().replace(/\s+/g, ' ').replace(/[.!?]$/, ''); }
  renderVals() {
    const s = this.state;
    const card = this.cards[s.idx % this.cards.length];
    const p = s.phase;
    const go = (patch) => this.setState(patch);
    const next = () => go({ idx: s.idx + 1, answer: '', phase: this.cards[(s.idx + 1) % this.cards.length].typed ? 'ask' : 'front' });
    const check = () => {
      if (!this.norm(s.answer)) return;
      const ok = this.norm(s.answer) === this.norm(card.back);
      go({ phase: ok ? 'right' : 'wrong', attempted: s.attempted + 1, correct: s.correct + (ok ? 1 : 0) });
    };
    const isTyped = card.typed;
    const st = !!s.starred[card.id];
    const hj = !!s.hanja[card.id];
    const fieldMap = {
      ask: ['Câu trả lời', '#4C5260', '#DDDBD3', '#FFFFFF'],
      right: ['맞아 — Chính xác', '#155A37', '#1C7146', '#E3F2EA'],
      over: ['✓ 맞아 — ' + card.back, '#155A37', '#1C7146', '#E3F2EA'],
      wrong: ['Chưa đúng — đáp án ở trên', '#8E2B22', '#B23A2E', '#FBE9E6'],
      revealed: ['Đã xem đáp án (tính là sai)', '#7A4800', '#9A5B00', '#FFF7EA']
    }[isTyped ? p : 'ask'] || ['Câu trả lời', '#4C5260', '#DDDBD3', '#FFFFFF'];
    const selfBackShown = !isTyped && (p === 'back');
    return {
      card,
      answer: s.answer,
      correct: s.correct, attempted: s.attempted, mastered: s.mastered,
      progressW: Math.round(s.mastered / 26 * 100) + '%',
      kindLabel: isTyped ? 'VIỆT → HÀN · GÕ ĐÁP ÁN' : 'HÀN → VIỆT · TỰ CHẤM',
      frontSize: isTyped ? '28px' : '22px',
      frontFont: isTyped ? 'Inter, sans-serif' : "'Noto Serif KR', serif",
      backFont: isTyped ? "'Noto Serif KR', serif" : 'Inter, sans-serif',
      backSize: isTyped ? '30px' : '19px',
      backInk: p === 'wrong' || p === 'revealed' ? '#8E2B22' : '#191C24',
      showBack: isTyped ? p !== 'ask' : selfBackShown,
      showNote: !!card.note && (isTyped ? p !== 'ask' : selfBackShown),
      isTyped, isSelf: !isTyped,
      isAsk: p === 'ask', isWrong: p === 'wrong', isDone: p === 'right' || p === 'over' || p === 'revealed',
      selfFront: !isTyped && p !== 'back', selfBack: selfBackShown,
      fieldLabel: fieldMap[0], fieldLabelInk: fieldMap[1], fieldBorder: fieldMap[2], fieldBg: fieldMap[3],
      starredStr: String(st), starBg: st ? '#FFF1DB' : '#FFFFFF', starInk: st ? '#9A5B00' : '#4C5260', starFill: st ? 'currentColor' : 'none',
      hanjaStr: String(hj), hanjaBg: hj ? '#191C24' : '#FFFFFF', hanjaInk: hj ? '#FFFFFF' : '#4C5260',
      onType: (e) => { if (p === 'ask') go({ answer: e.target.value }); },
      onKey: (e) => { if (e.key === 'Enter') { if (p === 'ask') check(); else next(); } },
      check,
      reveal: () => go({ phase: 'revealed', attempted: s.attempted + 1 }),
      override: () => go({ phase: 'over', correct: s.correct + 1 }),
      next,
      flip: () => go({ phase: 'back' }),
      remembered: () => { go({ attempted: s.attempted + 1, correct: s.correct + 1 }); setTimeout(next, 0); },
      forgot: () => { go({ attempted: s.attempted + 1 }); setTimeout(next, 0); },
      masterNow: () => { go({ mastered: Math.min(26, s.mastered + 1) }); setTimeout(next, 0); },
      toggleStar: () => go({ starred: Object.assign({}, s.starred, { [card.id]: !st }) }),
      toggleHanja: () => go({ hanja: Object.assign({}, s.hanja, { [card.id]: !hj }) })
    };
  }
}
</script>
</body>
</html>
