<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lịch sử</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{cursor:pointer}
button,a[style*="height:"]{white-space:nowrap;flex-shrink:0}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 var(--gb)}
.desk{word-break:keep-all;overflow-wrap:anywhere;background:radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 42%),radial-gradient(circle at 100% 78%,color-mix(in srgb,var(--flag) 22%,transparent),transparent 48%),var(--bg)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px}
.scroll{position:absolute;inset:0;overflow-y:auto;box-sizing:border-box;padding:58px 20px 120px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-0.02em}
.h2{margin:0;font-size:17px;font-weight:650}
.sub{font-size:13px;font-weight:500;color:var(--ink2)}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 32px;font:600 15px Inter,sans-serif}
.ctl{height:30px;min-width:30px;padding:0 10px;border-radius:999px;color:var(--ink);font:600 11px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.tabbar{position:absolute;left:16px;right:16px;bottom:22px;height:62px;box-sizing:border-box;border-radius:999px;padding:5px;display:flex;align-items:center;gap:2px;z-index:5}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;font:500 10px Inter,sans-serif;color:var(--ink);text-decoration:none}
.tab.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:650}
.fab{flex:none;width:60px;height:60px;margin:-14px 4px 0;border-radius:999px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 45%,transparent),0 0 0 4px color-mix(in srgb,var(--sf) 70%,transparent)}
.acc{position:absolute;left:16px;right:16px;z-index:5;box-sizing:border-box;border-radius:32px;padding:8px;display:flex;align-items:center;gap:8px}
.pbtn{height:48px;border-radius:999px;border:0;font:650 15px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.circ{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink);border:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.tile{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 14px 'Noto Sans KR',sans-serif}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="desk" style="{{vars}}; position: relative; width: 390px; height: 844px; overflow: hidden; color: var(--ink); font-family: Inter, 'Noto Sans KR', sans-serif;">
  <div class="sbar"><span>9:41</span><span style="display: flex; gap: 6px;"><button class="glass ctl" onClick="{{nextTheme}}" aria-label="Đổi theme"><span style="width: 10px; height: 10px; border-radius: 99px; background: var(--ac);"></span>{{themeName}}</button><button class="glass ctl" onClick="{{toggleDark}}" aria-label="Sáng / tối" style="padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button></span></div>
  <div class="scroll" style="gap: 16px;">
    <header style="display: flex; flex-direction: column; gap: 2px; padding-top: 6px;">
      <div class="sub">{{subtitle}}</div>
      <h1 class="h1">Lịch sử</h1>
    </header>

    <div role="group" aria-label="Chọn ngày" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px; scrollbar-width: none;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="15">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" aria-label="{{c.aria}}" style="flex: none; width: {{c.w}}; height: 58px; border-radius: 16px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0;">
          <span style="font-size: 11px; font-weight: 500; opacity: 0.8;">{{c.top}}</span>
          <span style="font-size: 16px; font-weight: 700;">{{c.big}}</span>
          <span style="width: 5px; height: 5px; border-radius: 99px; background: {{c.dot}};"></span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{filterRows}}" as="fr" hint-placeholder-count="2">
        <div role="group" aria-label="{{fr.label}}" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 7%, transparent);">
          <sc-for list="{{fr.opts}}" as="o" hint-placeholder-count="3">
            <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="flex: 1; height: 32px; border-radius: 10px; border: 0; background: {{o.bg}}; color: var(--ink); font: {{o.weight}} 13px Inter, sans-serif; box-shadow: {{o.sh}};">{{o.label}}</button>
          </sc-for>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{days}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <h2 class="h2" style="font-size: 15px;">{{g.title}}</h2>
          <span style="font-size: 12px; color: var(--ink2);">{{g.meta}}</span>
        </div>
        <div class="card" style="overflow: hidden;">
          <sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
            <div style="border-top: {{r.sep}};">
              <button onClick="{{r.toggle}}" aria-expanded="{{r.openStr}}" class="row" style="width: 100%; border: 0; background: transparent; font-family: inherit; text-align: left; white-space: normal; align-items: flex-start;">
                <div class="tile" style="background: {{r.tint}}; color: {{r.ink}};">{{r.skill}}</div>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
                  <div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;">
                    <span class="ell" style="font-size: 15px; font-weight: 600;">{{r.deck}}</span>
                    <span style="flex: none; font-size: 12px; color: var(--ink2);">{{r.time}}</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2);">
                    <span style="padding: 1px 7px; border-radius: 999px; background: {{r.doneBg}}; color: {{r.doneInk}}; font-weight: 650;">{{r.doneLabel}}</span>
                    <span>{{r.correct}}/{{r.attempted}} đúng · {{r.pct}}%</span>
                    <span>· {{r.device}}</span>
                  </div>
                  <sc-if value="{{r.hasResult}}" hint-placeholder-val="{{false}}">
                    <div style="font-size: 12px; font-weight: 600; color: {{r.resultInk}};">{{r.result}}</div>
                  </sc-if>
                </div>
              </button>
              <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 14px 70px; display: flex; flex-direction: column; gap: 10px;">
                  <div style="height: 8px; border-radius: 999px; overflow: hidden; display: flex; background: color-mix(in srgb, var(--bad) 30%, var(--sf));">
                    <div style="width: {{r.pct}}%; background: var(--ok);"></div>
                  </div>
                  <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2);">
                    <span>Thuộc {{r.mastered}}/{{r.total}} thẻ</span><span>{{r.span}} · {{r.dur}} phút</span>
                  </div>
                  <a href="Phone-Study.dc.html" class="pbtn" style="height: 40px; font-size: 14px; background: color-mix(in srgb, var(--ac) 14%, var(--sf)); color: var(--ac); text-decoration: none;">Học lại bộ này</a>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div class="card" style="padding: 24px; text-align: center; font-size: 14px; color: var(--ink2);">Không có lần học nào khớp bộ lọc.</div>
    </sc-if>
  </div>
  <nav aria-label="Điều hướng chính" class="glass tabbar">
    <a class="tab" href="Phone-Today.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>Hôm nay</span></a>
    <a class="tab" href="Phone-Listen.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg><span>Nghe</span></a>
    <a class="fab" href="Phone-Study.dc.html" aria-label="Học — bắt đầu ôn"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="16" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v14"></path></svg></a>
    <a class="tab" href="Phone-Library.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-.9 3 15.5-3.5.9z"></path></svg><span>Thư viện</span></a>
    <a class="tab on" href="Phone-History.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Lịch sử</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'paper', dark: false, day: null, device: 'all', done: 'all', open: { r0: true } };
    this.initTheme();
    this.initRecords();
    // Mở từ lịch nhiệt ở Hôm nay: Phone-History.dc.html?ago=N chọn sẵn ngày.
    try { const a = new URLSearchParams(window.location.search).get('ago'); if (a !== null && !isNaN(+a)) this.state.day = +a; } catch (e) {}
  }
  initTheme() {
    this.TH = {
      paper: ['Giấy', { bg: '#F5F4F0', sf: '#FFFFFF', ink: '#191C24', ink2: '#4C5260', ac: '#2B54C9', line: '#DDDBD3', on: '#FFFFFF' }, { bg: '#121418', sf: '#1B1E24', ink: '#ECEEF2', ink2: '#A9AFBC', ac: '#7C9BFF', line: '#343946', on: '#0B1020' }],
      ink: ['Mực đêm', { bg: '#EEF0F6', sf: '#FFFFFF', ink: '#141826', ink2: '#4A5068', ac: '#5B4BD6', line: '#D7DAE6', on: '#FFFFFF' }, { bg: '#0E1020', sf: '#171A2E', ink: '#E8E9F5', ink2: '#A3A7C4', ac: '#A99BFF', line: '#2B2F4A', on: '#120E2A' }],
      pine: ['Rừng thông', { bg: '#F1F4EF', sf: '#FFFFFF', ink: '#17201A', ink2: '#475449', ac: '#1F6B4A', line: '#D6DED6', on: '#FFFFFF' }, { bg: '#0F1712', sf: '#17221B', ink: '#E5EEE7', ink2: '#9DB0A3', ac: '#5CCB95', line: '#2A3A2F', on: '#06140C' }],
      dusk: ['Hoàng hôn', { bg: '#FAF3EE', sf: '#FFFFFF', ink: '#2A1A14', ink2: '#6A4E43', ac: '#B8402A', line: '#EADBD2', on: '#FFFFFF' }, { bg: '#1A1210', sf: '#251A17', ink: '#F5E9E4', ink2: '#C2A79D', ac: '#FF8A66', line: '#3D2C27', on: '#2A0E05' }],
      contrast: ['Tương phản cao', { bg: '#FFFFFF', sf: '#FFFFFF', ink: '#000000', ink2: '#222222', ac: '#0033CC', line: '#000000', on: '#FFFFFF' }, { bg: '#000000', sf: '#0A0A0A', ink: '#FFFFFF', ink2: '#E6E6E6', ac: '#FFD400', line: '#FFFFFF', on: '#000000' }],
      system: ['Hệ thống', { bg: '#F2F2F4', sf: '#FFFFFF', ink: '#1D1D1F', ink2: '#55555B', ac: '#0064D2', line: '#DADADF', on: '#FFFFFF' }, { bg: '#161618', sf: '#1F1F22', ink: '#F2F2F4', ink2: '#AAAAB0', ac: '#409CFF', line: '#38383C', on: '#03182E' }]
    };
  }
  themeVals() {
    const s = this.state; const go = (p) => this.setState(p);
    const ST = s.dark ? { ok: '#5CC48E', bad: '#F08174', flag: '#F2B54B', glass: 'rgba(30,32,40,0.5)', gb: 'rgba(255,255,255,0.16)', sh: '0 10px 34px rgba(0,0,0,0.5)' } : { ok: '#1C7146', bad: '#B23A2E', flag: '#9A5B00', glass: 'rgba(255,255,255,0.55)', gb: 'rgba(255,255,255,0.75)', sh: '0 10px 34px rgba(20,24,40,0.16)' };
    const t = Object.assign({}, this.TH[s.theme][s.dark ? 2 : 1], ST);
    const keys = Object.keys(this.TH);
    return {
      vars: `--bg:${t.bg};--sf:${t.sf};--ink:${t.ink};--ink2:${t.ink2};--ac:${t.ac};--line:${t.line};--on:${t.on};--ok:${t.ok};--bad:${t.bad};--flag:${t.flag};--glass:${t.glass};--gb:${t.gb};--sh:${t.sh}`,
      themeName: this.TH[s.theme][0],
      nextTheme: () => go({ theme: keys[(keys.indexOf(s.theme) + 1) % keys.length] }),
      toggleDark: () => go({ dark: !s.dark })
    };
  }
  // Lần học mẫu (StudySessionRecord) — dùng chung cho Hôm nay và Lịch sử.
  initRecords() {
      // Hôm nay = Thứ Sáu 13/11/2026; dữ liệu mẫu ~17 tuần (lưới kiểu GitHub ở Hôm nay).
      this.today = new Date(2026, 10, 13);
      const D = [
        ['Plastic · tái chế', '읽기', '--ac', 26], ['Rừng & Bảo vệ môi trường', '읽기', '--ac', 26], ['듣기 4-8번 > 병원', '듣기', '--ok', 11],
        ['Tự học ngữ pháp', '문법', '--flag', 9], ['Lỗi sai · Bài tập 07', '쓰기', '--bad', 5], ['-던 vs -었던', '문법', '--flag', 3]
      ];
      const rec = (ago, deck, device, hm, dur, attempted, correct, mastered, completed, early) => {
        const [name, skill, tone, total] = D[deck];
        return { ago, deck: name, skill, tone, total, device, hm, dur, attempted, correct, mastered: completed ? total : mastered, completed, early: !!early };
      };
      this.records = [
        rec(0, 0, 'iPhone', '07:42', 9, 21, 18, 11, false),
        rec(0, 3, 'Mac', '21:05', 6, 12, 11, 0, true),
        rec(1, 2, 'Mac', '22:10', 12, 18, 12, 0, true),
        rec(1, 0, 'iPhone', '12:30', 5, 9, 7, 6, false),
        rec(2, 1, 'Mac', '20:48', 18, 31, 28, 0, true),
        rec(3, 4, 'iPhone', '08:05', 4, 7, 6, 0, true, true),
        rec(3, 5, 'Mac', '21:40', 3, 4, 4, 0, true),
        rec(4, 1, 'iPhone', '07:15', 7, 14, 9, 13, false)
      ];
      // Ngày cũ hơn: sinh lần học mẫu ổn định theo chỉ số ngày.
      for (let ago = 5; ago < 119; ago++) {
        if (ago >= 12 && (ago % 5 === 0 || ago % 7 === 3)) continue;
        if (ago >= 33 && ((ago * 7) % 10 < 3 || (ago >= 70 && ago % 3 === 0))) continue;
        const k = (ago * 7) % 6, n = 6 + (ago * 13) % 22, c = Math.round(n * (0.62 + ((ago * 17) % 35) / 100));
        this.records.push(rec(ago, k, ago % 3 ? 'Mac' : 'iPhone', (19 + ago % 4) + ':' + String((ago * 11) % 60).padStart(2, '0'), 3 + ago % 12, n, Math.min(n, c), 3, ago % 4 !== 1));
        if (ago % 4 === 0) this.records.push(rec(ago, (k + 2) % 6, 'iPhone', '07:' + String(10 + ago).padStart(2, '0'), 4, 8, 7, 2, false));
      }
      this.records.forEach((r, i) => { r.id = 'r' + i; });
  }
  dateOf(ago) { const d = new Date(this.today); d.setDate(d.getDate() - ago); return d; }
  renderVals() {
    const s = this.state; const go = (p) => this.setState(p);
    const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    const dm = (d) => d.getDate() + '/' + (d.getMonth() + 1);
    const dayTitle = (ago) => ago === 0 ? 'Hôm nay' : ago === 1 ? 'Hôm qua' : WD[this.dateOf(ago).getDay()] + ', ' + dm(this.dateOf(ago));
    const match = (r) => (s.device === 'all' || r.device === s.device) && (s.done === 'all' || (s.done === 'done') === r.completed);
    const scoped = this.records.filter(r => (s.day !== null ? r.ago === s.day : r.ago < 30) && match(r));
    const days = [];
    scoped.forEach(r => { let g = days.find(x => x.ago === r.ago); if (!g) days.push(g = { ago: r.ago, list: [] }); g.list.push(r); });
    days.sort((a, b) => a.ago - b.ago);
    const has = {}; this.records.forEach(r => { has[r.ago] = true; });
    const WS = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    const chip = (on, top, big, dot, aria, pick, w) => ({ on: String(on), top, big, aria, pick, w,
      bg: on ? 'var(--ink)' : 'var(--sf)', ink: on ? 'var(--sf)' : 'var(--ink)', border: on ? 'var(--ink)' : 'var(--line)',
      dot: dot ? (on ? 'var(--sf)' : 'var(--ac)') : 'transparent' });
    const seg = (label, key, opts) => ({ label, opts: opts.map(([k, l]) => {
      const on = s[key] === k;
      return { label: l, on: String(on), bg: on ? 'var(--sf)' : 'transparent', weight: on ? '700' : '500', sh: on ? '0 1px 4px rgba(0,0,0,0.12)' : 'none', pick: () => go({ [key]: k }) };
    }) });
    return Object.assign(this.themeVals(), {
      subtitle: scoped.length + ' lần học · ' + (s.day !== null ? dayTitle(s.day) : '30 ngày qua'),
      chips: [chip(s.day === null, '30 ngày', 'Tất cả', false, 'Tất cả 30 ngày', () => go({ day: null }), '74px')].concat(
        Array.from({ length: 14 }, (_, ago) => {
          const d = this.dateOf(ago);
          return chip(s.day === ago, ago === 0 ? 'Nay' : WS[d.getDay()], d.getDate(), !!has[ago], dm(d), () => go({ day: s.day === ago ? null : ago }), '50px');
        })),
      filterRows: [
        seg('Lọc theo máy', 'device', [['all', 'Mọi máy'], ['Mac', 'Mac'], ['iPhone', 'iPhone']]),
        seg('Lọc theo kết quả', 'done', [['all', 'Mọi kết quả'], ['done', 'Hết bộ'], ['part', 'Dở']])
      ],
      empty: scoped.length === 0,
      days: days.map(g => {
        const a = g.list.reduce((x, r) => x + r.attempted, 0), c = g.list.reduce((x, r) => x + r.correct, 0);
        return {
          title: dayTitle(g.ago), meta: g.list.length + ' lượt · ' + Math.round(c / a * 100) + '% đúng',
          items: g.list.map((r, i) => {
            const pct = Math.round(r.correct / r.attempted * 100), open = !!s.open[r.id];
            const result = !r.completed ? '' : r.early ? 'Học trước hẹn · giữ lịch' : pct >= 80 ? 'Lên bậc · hẹn ôn sau 7 ngày' : 'Dưới 80% · về bậc 1, ôn lại mai';
            const endMin = parseInt(r.hm.split(':')[0], 10) * 60 + parseInt(r.hm.split(':')[1], 10) + r.dur;
            return {
              deck: r.deck, skill: r.skill, tint: `color-mix(in srgb, var(${r.tone}) 14%, var(--sf))`, ink: `var(${r.tone})`,
              time: r.hm, device: r.device, correct: r.correct, attempted: r.attempted, pct,
              mastered: r.mastered, total: r.total, dur: r.dur,
              span: r.hm + '–' + String(Math.floor(endMin / 60) % 24).padStart(2, '0') + ':' + String(endMin % 60).padStart(2, '0'),
              doneLabel: r.completed ? 'Hết bộ' : 'Dở',
              doneBg: r.completed ? 'color-mix(in srgb, var(--ok) 14%, var(--sf))' : 'color-mix(in srgb, var(--ink) 8%, var(--sf))',
              doneInk: r.completed ? 'var(--ok)' : 'var(--ink2)',
              hasResult: !!result, result,
              resultInk: r.early ? 'var(--ink2)' : pct >= 80 ? 'var(--ac)' : 'var(--bad)',
              sep: i ? '1px solid var(--line)' : '0',
              open, openStr: String(open),
              toggle: () => go({ open: Object.assign({}, s.open, { [r.id]: !open }) })
            };
          })
        };
      })
    });
  }
}
</script>
</body>
</html>
