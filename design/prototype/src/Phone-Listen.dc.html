<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Luyện nghe clip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B54C9}a:hover{color:#1E3E99}
button{cursor:pointer}
/* Chữ trong nút không bao giờ xuống dòng */
button,.nav,.kbd,a[style*="height:"]{white-space:nowrap}
button,a[style*="height:"]{flex-shrink:0}
button>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #191C24; font-family: Inter, 'Noto Sans KR', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 56px 20px 20px; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; justify-content: space-between; align-items: center;">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Nghe</h1>
      <span style="font-size: 13px; color: #4C5260;">Clip 2/5 hôm nay</span>
    </header>

    <section style="background: #FFFFFF; border: 1px solid #DDDBD3; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column;">
      <div style="position: relative; height: 150px; background: #EEEDE8; display: flex; align-items: center; justify-content: center;">
        <div style="position: absolute; left: 14px; top: 12px; right: 14px; font-size: 12px; color: #4C5260; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">SNU4A-07-듣기.m4a · clip 4.5s</div>
        <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 44px; bottom: 44px; display: flex; align-items: center; gap: 3px; opacity: 0.55;"><sc-for list="{{wave}}" as="w" hint-placeholder-count="48"><div style="flex: 1; height: {{w}}; border-radius: 2px; background: #1C7146;"></div></sc-for></div>
        <button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="position: relative; width: 64px; height: 64px; border-radius: 999px; border: 0; background: #191C24; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{playing}}" hint-placeholder-val="{{false}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
          </sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{true}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </sc-if>
        </button>
        <div style="position: absolute; left: 14px; bottom: 12px; padding: 3px 8px; border-radius: 6px; background: #FFFFFF; color: #191C24; font-size: 12px; font-family: ui-monospace, Menlo, monospace;">0:42.5 → 0:47.0</div>
      </div>
      <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="position: relative; height: 8px; border-radius: 999px; background: #EEEDE8;">
            <div style="position: absolute; left: 0; top: 0; height: 8px; width: {{posW}}; border-radius: 999px; background: #1C7146;"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #4C5260; font-family: ui-monospace, Menlo, monospace;"><span>{{posLabel}}</span><span>4.5s</span></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <div role="group" aria-label="Tốc độ" style="display: flex; gap: 6px;">
            <sc-for list="{{speeds}}" as="sp" hint-placeholder-count="3">
              <button onClick="{{sp.pick}}" aria-pressed="{{sp.on}}" style="min-width: 52px; height: 40px; border-radius: 999px; border: 1px solid {{sp.border}}; background: {{sp.bg}}; color: {{sp.ink}}; font: 600 13px Inter, sans-serif;">{{sp.label}}</button>
            </sc-for>
          </div>
          <button onClick="{{toggleLoop}}" aria-pressed="{{loopStr}}" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{loopBorder}}; background: {{loopBg}}; color: {{loopInk}}; font: 600 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg>
            Lặp A-B
          </button>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Chép chính tả — gõ lại câu bạn nghe được
        <textarea value="{{answer}}" onChange="{{onType}}" lang="ko" rows="3" placeholder="듣고 쓰세요…" style="box-sizing: border-box; border-radius: 14px; border: 1.5px solid #DDDBD3; background: #FFFFFF; padding: 12px 14px; font: 500 17px/1.5 'Noto Sans KR', sans-serif; color: #191C24; resize: none;"></textarea>
      </label>
      <sc-if value="{{checked}}" hint-placeholder-val="{{false}}">
        <div style="background: #FFFFFF; border: 1px solid #DDDBD3; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; flex-wrap: wrap; gap: 6px; font-family: 'Noto Serif KR', serif; font-size: 18px; font-weight: 600;">
            <sc-for list="{{words}}" as="w" hint-placeholder-count="6">
              <span style="padding: 2px 6px; border-radius: 6px; background: {{w.bg}}; color: {{w.ink}};">{{w.t}}</span>
            </sc-for>
          </div>
          <div style="font-size: 13px; color: #4C5260;">Dùng chai nhựa làm chất liệu may đồ thể thao thì nhẹ và mát. · Đúng {{score}}</div>
        </div>
      </sc-if>
      <div style="display: flex; gap: 10px;">
        <button onClick="{{reveal}}" style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #DDDBD3; background: #FFFFFF; color: #191C24; font: 600 15px Inter, sans-serif;">Xem câu gốc</button>
        <button onClick="{{check}}" style="flex: 1.4; height: 50px; border-radius: 14px; border: 0; background: #1C7146; color: #FFFFFF; font: 600 16px Inter, sans-serif;">Chấm</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Tiếp theo</h2>
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDDBD3;">
          <div style="width: 52px; height: 36px; border-radius: 8px; background: #191C24; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, monospace;">{{q.len}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 14px; font-weight: 600; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{q.t}}</div>
            <div style="font-size: 12px; color: #4C5260;">{{q.meta}}</div>
          </div>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Điều hướng chính" style="display: flex; justify-content: space-around; padding: 10px 8px 30px; background: #FFFFFF; border-top: 1px solid #DDDBD3;">
    <a href="Phone-Today.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 500; color: #4C5260; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Hôm nay</a>
    <a href="Phone-Study.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 500; color: #4C5260; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="16" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v14"></path></svg>Học</a>
    <a href="Phone-Listen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 600; color: #2B54C9; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>Nghe</a>
    <a href="Mac-Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; font-size: 11px; font-weight: 500; color: #4C5260; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-.9 3 15.5-3.5.9z"></path></svg>Thư viện</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: false, pos: 0, speed: 0.75, loop: true, answer: '', checked: false };
    this.target = '플라스틱 병을 소재로 해서 운동복을 만들면 가볍고 시원하다';
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state;
      if (!s.playing) return;
      let pos = s.pos + 0.1 * s.speed;
      if (pos >= 4.5) { if (s.loop) pos = 0; else { this.setState({ playing: false, pos: 4.5 }); return; } }
      this.setState({ pos });
    }, 100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state;
    const go = (p) => this.setState(p);
    const tw = this.target.split(' ');
    const aw = s.answer.normalize('NFC').trim().split(/\s+/);
    const words = tw.map((t, i) => {
      const ok = aw[i] === t;
      return { t, bg: ok ? '#E3F2EA' : '#FBE9E6', ink: ok ? '#155A37' : '#8E2B22' };
    });
    const hits = words.filter(w => w.bg === '#E3F2EA').length;
    return {
      playing: s.playing, paused: !s.playing,
      playLabel: s.playing ? 'Tạm dừng' : 'Phát đoạn',
      togglePlay: () => go({ playing: !s.playing, pos: s.pos >= 4.5 ? 0 : s.pos }),
      posW: Math.round(s.pos / 4.5 * 100) + '%',
      posLabel: s.pos.toFixed(1) + 's',
      speeds: [0.5, 0.75, 1].map(v => ({
        label: v + '×', on: String(s.speed === v),
        bg: s.speed === v ? '#191C24' : '#FFFFFF', ink: s.speed === v ? '#FFFFFF' : '#191C24', border: s.speed === v ? '#191C24' : '#DDDBD3',
        pick: () => go({ speed: v })
      })),
      loopStr: String(s.loop),
      loopBg: s.loop ? '#E3F2EA' : '#FFFFFF', loopInk: s.loop ? '#155A37' : '#4C5260', loopBorder: s.loop ? '#1C7146' : '#DDDBD3',
      toggleLoop: () => go({ loop: !s.loop }),
      answer: s.answer,
      onType: (e) => go({ answer: e.target.value, checked: false }),
      check: () => go({ checked: true }),
      reveal: () => go({ checked: true, answer: this.target }),
      checked: s.checked,
      words, score: hits + '/' + tw.length + ' từ',
      wave: Array.from({ length: 48 }, (_, i) => Math.round(18 + 80 * Math.abs(Math.sin(i * 0.45) * Math.sin(i * 0.13 + 1))) + '%'),
      queue: [
        { len: '3.2s', t: '음식물 쓰레기를 줄이기 위해서', meta: 'Sai 2 lần · ★' },
        { len: '5.0s', t: '갓생이란 부지런하고 생산적인 삶을', meta: 'Mới thêm hôm qua' }
      ]
    };
  }
}
</script>
</body>
</html>
